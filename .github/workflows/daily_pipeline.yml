name: RealGitRank Daily Pipeline

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # The BigQuery backfill takes ~75 minutes on its own. It used to share one job
  # with the scoring half, so a failure there threw the whole backfill away and
  # the next run paid for it again. Separate job + artifact keeps it.
  backfill:
    name: Backfill BigQuery activity
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Backfill CI attribution into the window (once per shard)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python -m src.pipeline.ingest_bigquery --backfill || echo "CI backfill skipped"

      - name: Backfill 12-month activity (BigQuery, idempotent)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python -m src.pipeline.ingest_bigquery --backfill-activity 12 || echo "activity backfill skipped"

      - name: Upload activity store
        uses: actions/upload-artifact@v4
        with:
          name: activity-store
          path: |
            data/activity
            data/rolling
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ingest-and-score:
    needs: backfill
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore activity store
        uses: actions/download-artifact@v4
        with:
          name: activity-store
          path: data

      - name: Run pipeline (gharchive.org -> monthly activity -> snapshots)
        env:
          GH_ENRICH_TOKEN: ${{ secrets.GH_ENRICH_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python -u src/pipeline/run.py
        # gharchive.org is the source; BigQuery attribution is optional and only
        # runs when GCP credentials are configured (see ingest_bigquery.py).

      - name: Data quality gates
        run: python src/pipeline/quality_gates.py

      - name: Enrich (country, avatar, bio) — optional
        env:
          GH_ENRICH_TOKEN: ${{ secrets.GH_ENRICH_TOKEN }}
        run: python src/pipeline/enrich.py || echo "enrichment skipped (no token)"

      - name: Enrich language (one-time, cached) — optional
        env:
          GH_ENRICH_TOKEN: ${{ secrets.GH_ENRICH_TOKEN }}
        run: python -c "import sys; sys.path.insert(0,'src/pipeline'); from enrich import enrich_language; enrich_language()" || echo "language enrichment skipped"

      - name: Publish coverage report
        run: python -m src.pipeline.coverage

      - name: Generate badges
        run: python src/pipeline/badges.py

      - name: Generate static API + llms.txt
        run: python -m src.pipeline.static_api

      - name: Rebuild static site
        env:
          PUBLIC_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: |
          python -m src.pipeline.sitemap
          # Replace (not merge) the copied data dir so profiles for users who
          # dropped out of the top 1000 don't linger as stale public files.
          rm -rf web/public/data
          mkdir -p web/public/data
          # Only public data: raw hourly downloads, rolling shards and parquet stay private.
          # leaderboard.json (50MB+) and history/ are pipeline-internal: the site reads
          # /data/chunks and /data/profiles only, so they stay out of the public payload.
          # activity/ (12 months of monthly rollups) and the parquet are pipeline
          # internals: the site reads the score from the chunks, never these files.
          rsync -a --exclude 'gharchive_raw/' --exclude 'rolling/' --exclude 'raw.parquet' \
            --exclude 'activity/' --exclude 'activity.parquet' \
            --exclude '*.log' --exclude 'enrichment_cache.json' --exclude 'language_cache.json' \
            --exclude 'leaderboard.json' --exclude 'long_tail.json' --exclude 'history/' \
            --exclude 'automation_signals.json' \
            data/ web/public/data/
          python -m src.pipeline.chunks
          cd web
          npm ci
          npm run build

      - name: Commit snapshots + site
        run: |
          git config user.name "ErBharatMalhotra"
          git config user.email "mr.bharatmalhotra@gmail.com"
          git add data/ web/public/badges/
          git commit -m "chore: daily RealGitRank snapshot $(date -u +%Y-%m-%d)" || echo "no changes"
          git push origin HEAD:main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Let Pages artifact metadata settle
        run: sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'pipeline-failure: daily run failed',
              body: 'See workflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['pipeline-failure']
            })
