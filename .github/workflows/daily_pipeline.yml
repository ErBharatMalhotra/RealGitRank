name: RealGitRank Daily Pipeline

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  ingest-and-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install duckdb numpy pyarrow google-cloud-bigquery requests

      - name: Run pipeline (BigQuery -> DuckDB -> snapshots)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python src/pipeline/run.py
        # fallback chain handled inside run.py: BigQuery -> gharchive.org -> last snapshot

      - name: Data quality gates
        run: python src/pipeline/quality_gates.py

      - name: Rebuild static site
        run: |
          cd web
          npm ci
          npm run build

      - name: Commit snapshots + site
        run: |
          git config user.name "ErBharatMalhotra"
          git config user.email "mr.bharatmalhotra@gmail.com"
          git add data/ web/dist/ web/public/badges/
          git commit -m "chore: daily RealGitRank snapshot $(date -u +%Y-%m-%d)" || echo "no changes"
          git push

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'pipeline-failure: daily run failed',
              body: 'See workflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['pipeline-failure']
            })