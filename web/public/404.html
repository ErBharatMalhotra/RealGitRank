<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Not Found — RealGitRank</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
    h1 { background: linear-gradient(90deg,#60a5fa,#34d399); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 3rem; }
    a { color: #60a5fa; }
    img { margin: 20px 0; }
  </style>
</head>
<body>
  <div>
    <h1>RealGitRank</h1>
    <p>This user is not ranked yet — or the page doesn't exist.</p>
    <img src="/badges/default.svg" alt="RealGitRank badge" width="200" height="60" />
    <p><a href="/">← Back to leaderboard</a></p>
    <p style="color:#94a3b8;font-size:13px">Not ranked? Contribute on GitHub and you'll appear in the next daily snapshot.</p>
  </div>
  <script>
    // Shared links to /profile/<user>/ only exist as build-time pages for the top 1,000.
    // Everyone else is served through the query-param profile page, which reads the
    // leaderboard chunks, so route old links there instead of showing a 404.
    (function () {
      var m = location.pathname.match(/^\/profile\/([^\/]+)\/?$/);
      if (!m) return;
      var user = decodeURIComponent(m[1]);
      if (!user || user === 'index.html') return;
      location.replace('/profile/?u=' + encodeURIComponent(user));
    })();
  </script>
</body>
</html>
