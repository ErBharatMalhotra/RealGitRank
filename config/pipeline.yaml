bigquery:
  project: ${GCP_PROJECT_ID}
  dataset: githubarchive
  free_tier_tb_per_month: 1
  candidate_pool_limit: 200000
  min_pushes: 5
  min_merged_prs: 1

fallback:
  - bigquery
  - gharchive_org  # hourly .json.gz direct download
  - last_good_snapshot

enrichment:
  top_n: 10000
  batch_size: 100
  graphql_points_per_hour: 5000

quality_gates:
  row_count_min_pct_of_30d_median: 80
  username_null_max_pct: 0
  score_shift_sigma_max: 3
  bot_classification_jump_max_x: 2
  min_baseline_days: 5      # runs needed before growth/shift gates engage
  bot_rate_floor: 0.005     # ignore bot-rate noise below this baseline
  min_rows_absolute: 10     # absolute floor, independent of history
  score_max_absolute: 1000000  # activity is an absolute count, no 0-1000 cap

hosting:
  provider: github_pages
  custom_domain: realgitrank.bharatdn.com
  deploy_on_push: true